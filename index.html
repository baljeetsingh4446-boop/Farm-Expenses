<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Farm Ledger</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1F3325" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
  :root {
    --bg: #1F3325;
    --bg-deep: #182A1D;
    --card: #2A4030;
    --card-border: #3B5540;
    --cream: #F3EEDD;
    --cream-dim: #C9C4AE;
    --gold: #D4A017;
    --diesel: #5C8FBF;
    --labour: #C1440E;
    --fert: #5A8F4C;
    --other: #9C8C74;
    --income-green: #4CAF50;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  #app { max-width: 448px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header { padding: 20px 20px 16px; border-bottom: 1px solid var(--card-border); transition: filter 0.2s; }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { font-size: 13px; letter-spacing: 2px; color: var(--gold); font-weight: 700; text-transform: uppercase; }
  .total { font-size: 26px; font-weight: 800; line-height: 1.1; margin-top: 2px; }
  .total small { font-size: 12px; color: var(--cream-dim); font-weight: 500; margin-left: 6px; font-family: inherit; }
  .storage-tag { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #8FBF8A; }

  main { flex: 1; padding: 18px 16px 90px; overflow-y: auto; transition: filter 0.2s; }

  .section-title { font-size: 20px; font-weight: 700; margin-bottom: 14px; }

  label.field-label {
    display: block; font-size: 12px; font-weight: 600; color: var(--cream-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="date"], input[type="number"], input[type="text"], input[type="password"] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--cream); font-size: 15px; outline: none;
  }
  input::placeholder { color: var(--cream-dim); opacity: 0.7; }

  .type-toggle-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-toggle-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--cream-dim); font-size: 14px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .type-toggle-btn.active-expense { border-color: var(--labour); background: rgba(193, 68, 14, 0.2); color: #FF7A59; }
  .type-toggle-btn.active-income { border-color: var(--income-green); background: rgba(76, 175, 80, 0.2); color: #81C784; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    padding: 12px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--cream); cursor: pointer; text-align: left; font-size: 13px; font-weight: 600;
  }
  .cat-btn .dot { width: 18px; height: 18px; border-radius: 5px; }
  .cat-btn.active { border-width: 2px; }

  .amount-wrap { position: relative; }
  .amount-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--cream-dim); font-size: 17px; }
  .amount-wrap input { padding-left: 30px; }

  .error-text { color: #E2A05A; font-size: 13px; margin-top: 10px; }

  .save-btn {
    margin-top: 20px; width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--gold); color: #1F2A17; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .save-btn.flash { background: #4C7A3D; color: #fff; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month-nav button { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 12px; color: var(--cream); cursor: pointer; font-size: 16px; }
  .month-center { text-align: center; }
  .month-center .m-title { font-size: 18px; font-weight: 700; }
  .month-center .m-total { font-size: 12px; color: var(--cream-dim); }

  .day-label { font-size: 12px; color: var(--cream-dim); margin-bottom: 6px; font-weight: 600; }
  .expense-row {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--card-border); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px;
  }
  .expense-row .icon-box { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .expense-row .info { flex: 1; min-width: 0; }
  .expense-row .info .cat-name { font-size: 14px; font-weight: 600; }
  .expense-row .info .note { font-size: 12px; color: var(--cream-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-row .amt { font-weight: 700; font-size: 14px; }
  .expense-row .amt.income { color: #81C784; }
  .expense-row .amt.expense { color: var(--cream); }

  .action-wrap { display: flex; gap: 4px; }
  .icon-btn { background: transparent; border: none; color: var(--cream-dim); cursor: pointer; padding: 4px; font-size: 15px; }
  .confirm-yes { background: var(--labour); border: none; border-radius: 6px; padding: 6px 8px; color: #fff; cursor: pointer; }
  .confirm-no { background: transparent; border: 1px solid var(--card-border); border-radius: 6px; padding: 6px 8px; color: var(--cream-dim); cursor: pointer; }

  .empty { text-align: center; color: var(--cream-dim); margin-top: 50px; font-size: 14px; }

  .pnl-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 18px;
  }
  .pnl-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .pnl-row.total { border-top: 1px solid var(--card-border); padding-top: 10px; margin-top: 10px; font-size: 16px; font-weight: 700; }

  .toggle-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .toggle-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--card-border); background: transparent; color: var(--cream-dim); font-size: 13px; font-weight: 600; cursor: pointer; }
  .toggle-btn.active { border-color: var(--gold); background: rgba(212,160,23,0.13); color: var(--gold); }

  .legend-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--card-border); }
  .legend-row .icon-box { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .legend-row .name { flex: 1; font-size: 14px; font-weight: 600; }
  .legend-row .val { font-weight: 700; font-size: 14px; text-align: right; }

  nav.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 448px;
    background: var(--bg-deep); border-top: 1px solid var(--card-border); display: flex;
    padding: 8px 8px calc(env(safe-area-inset-bottom, 8px) + 8px);
  }
  nav.tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0;
    background: transparent; border: none; color: var(--cream-dim); cursor: pointer; font-size: 11px; font-weight: 500;
  }
  nav.tabbar button.active { color: var(--gold); font-weight: 700; }
  nav.tabbar button .nav-icon { font-size: 19px; }

  /* PIN Lock */
  .pin-overlay {
    position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .pin-card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 320px;
  }
  .pin-card input {
    text-align: center; font-size: 24px; letter-spacing: 6px; padding: 10px; margin-top: 8px;
  }
</style>
</head>
<body>

<!-- Security PIN Screen -->
<div id="pinOverlay" class="pin-overlay">
  <div class="pin-card">
    <div class="eyebrow" style="text-align: center; margin-bottom: 8px;">Farm Ledger</div>
    <div style="font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 12px;">Enter PIN</div>
    <input type="password" id="pinInput" placeholder="••••" maxlength="6" pattern="[0-9]*" inputmode="numeric" />
    <div id="pinError" class="error-text" style="text-align: center; min-height: 18px;"></div>
    <button id="unlockBtn" class="save-btn" style="margin-top: 14px;">🔓 Unlock Ledger</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-row">
      <div>
        <div class="eyebrow">Farm Ledger</div>
        <div class="total"><span id="monthTotalHeader">₹0</span><small id="headerSub">net profit</small></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
        <button id="lockAppBtn" style="background: transparent; border: 1px solid var(--card-border); color: var(--cream-dim); border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;">🔒 Lock</button>
        <div class="storage-tag" id="syncTag">☁️ <span id="syncTagText">Connecting…</span></div>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button id="navAdd" class="active"><span class="nav-icon">➕</span>Add</button>
    <button id="navRecords"><span class="nav-icon">📋</span>Records</button>
    <button id="navSummary"><span class="nav-icon">📊</span>Summary</button>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  initializeFirestore,
  persistentLocalCache,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9uts7jAr6qWEWyER2vtMLQPjOGDJwgJ4",
  authDomain: "farm-expenses-99788.firebaseapp.com",
  projectId: "farm-expenses-99788",
  storageBucket: "farm-expenses-99788.firebasestorage.app",
  messagingSenderId: "612925224352",
  appId: "1:612925224352:web:1f6c06c08bb421b3c1e0c5"
};

const fbApp = initializeApp(firebaseConfig);
const db = initializeFirestore(fbApp, { localCache: persistentLocalCache() });
const expensesCol = collection(db, "expenses");

(function () {
  "use strict";

  // PIN Lock Logic
  const TARGET_PIN = "6638";
  var isUnlocked = sessionStorage.getItem("farm_unlocked") === "true";

  function updateLockState() {
    var overlay = document.getElementById("pinOverlay");
    var appMain = document.getElementById("main");
    var header = document.querySelector("header");
    var tabbar = document.querySelector("nav.tabbar");

    if (!isUnlocked) {
      overlay.style.display = "flex";
      if (appMain) appMain.style.filter = "blur(12px)";
      if (header) header.style.filter = "blur(12px)";
      if (tabbar) tabbar.style.pointerEvents = "none";
    } else {
      overlay.style.display = "none";
      if (appMain) appMain.style.filter = "none";
      if (header) header.style.filter = "none";
      if (tabbar) tabbar.style.pointerEvents = "auto";
    }
  }

  document.getElementById("unlockBtn").addEventListener("click", function() {
    var entered = document.getElementById("pinInput").value;
    var errorEl = document.getElementById("pinError");
    if (entered === TARGET_PIN) {
      isUnlocked = true;
      sessionStorage.setItem("farm_unlocked", "true");
      document.getElementById("pinInput").value = "";
      errorEl.textContent = "";
      updateLockState();
    } else {
      errorEl.textContent = "Incorrect PIN. Try again.";
      document.getElementById("pinInput").value = "";
    }
  });

  document.getElementById("pinInput").addEventListener("keyup", function(e) {
    if (e.key === "Enter") document.getElementById("unlockBtn").click();
  });

  document.getElementById("lockAppBtn").addEventListener("click", function() {
    isUnlocked = false;
    sessionStorage.removeItem("farm_unlocked");
    updateLockState();
  });

  var EXPENSE_CATEGORIES = [
    { id: "diesel", label: "Diesel", short: "Diesel", color: "var(--diesel)", hex: "#5C8FBF", emoji: "⛽" },
    { id: "labour", label: "Labour", short: "Labour", color: "var(--labour)", hex: "#C1440E", emoji: "👷" },
    { id: "fertilizer", label: "Fertilizers & Chemicals", short: "Fert. & Chem.", color: "var(--fert)", hex: "#5A8F4C", emoji: "🌱" },
    { id: "other", label: "Other Expenses", short: "Other", color: "var(--other)", hex: "#9C8C74", emoji: "•••" }
  ];

  var INCOME_CATEGORIES = [
    { id: "paddy_sale", label: "Paddy Sale", short: "Paddy", color: "#4CAF50", hex: "#4CAF50", emoji: "🌾" },
    { id: "cotton_sale", label: "Cotton Sale", short: "Cotton", color: "#00BCD4", hex: "#00BCD4", emoji: "☁️" },
    { id: "subsidy", label: "Govt Subsidy", short: "Subsidy", color: "#FF9800", hex: "#FF9800", emoji: "🏛️" },
    { id: "other_income", label: "Other Income", short: "Other Inc.", color: "#81C784", hex: "#81C784", emoji: "💰" }
  ];

  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  
  function catById(id, type) {
    var cats = type === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i];
    return { id: id, label: "General", short: "General", color: "var(--other)", hex: "#9C8C74", emoji: "📝" };
  }

  function todayISO() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function formatRupee(n) { n = Number(n||0); var sign = n < 0 ? "-" : ""; return sign + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN"); }
  function formatDateLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    var day = d.getDate();
    var mon = MONTHS[d.getMonth()].slice(0,3);
    return day + " " + mon + " " + d.getFullYear();
  }

  var state = {
    tab: "add",
    expenses: [],
    editingId: null,
    form: { type: "expense", date: todayISO(), category: null, amount: "", note: "", error: "" },
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    confirmDelete: null,
    range: "month"
  };

  function getFinancials(list) {
    var income = list.filter(function(e){ return e.type === "income"; }).reduce(function(s,e){ return s + e.amount; }, 0);
    var expense = list.filter(function(e){ return e.type !== "income"; }).reduce(function(s,e){ return s + e.amount; }, 0);
    return { income: income, expense: expense, profit: income - expense };
  }

  function monthExpenses() {
    return state.expenses.filter(function(e){
      var d = new Date(e.date+"T00:00:00");
      return d.getFullYear()===state.viewYear && d.getMonth()===state.viewMonth;
    }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  }

  function groupByDate(list) {
    var map = {}, order = [];
    list.forEach(function(e){
      if (!map[e.date]) { map[e.date] = []; order.push(e.date); }
      map[e.date].push(e);
    });
    order.sort(function(a,b){ return a<b?1:-1; });
    return order.map(function(d){ return [d, map[d]]; });
  }

  function summarySource() {
    return state.range === "all" ? state.expenses : monthExpenses();
  }

  // ---------- render ----------
  function render() {
    var now = new Date();
    var thisMonthItems = state.expenses.filter(function(e){
      var d = new Date(e.date+"T00:00:00");
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    });
    var stats = getFinancials(thisMonthItems);
    
    var headerEl = document.getElementById("monthTotalHeader");
    headerEl.textContent = formatRupee(stats.profit);
    headerEl.style.color = stats.profit >= 0 ? "#81C784" : "#FF7A59";

    ["navAdd","navRecords","navSummary"].forEach(function(id){ document.getElementById(id).classList.remove("active"); });
    document.getElementById("nav" + state.tab[0].toUpperCase() + state.tab.slice(1)).classList.add("active");

    var main = document.getElementById("main");
    if (state.tab === "add") main.innerHTML = renderAdd();
    else if (state.tab === "records") main.innerHTML = renderRecords();
    else main.innerHTML = renderSummary();

    attachHandlers();
  }

  function renderAdd() {
    var f = state.form;
    var currentCats = f.type === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;

    var catButtons = currentCats.map(function(c){
      var active = f.category === c.id;
      return '<button type="button" class="cat-btn' + (active ? " active" : "") + '" data-cat="' + c.id + '" style="' +
        (active ? "border-color:" + c.color + ";background:" + c.color + "22;" : "") + '">' +
        '<span class="dot" style="background:' + c.color + '"></span>' +
        '<span>' + c.label + '</span></button>';
    }).join("");

    var titleText = state.editingId ? "Edit Transaction" : "Record Transaction";
    var saveText = state.editingId ? "✏️ Update Entry" : (f.type === "income" ? "💰 Save Income" : "➕ Save Expense");

    return '' +
      '<div class="section-title">' + titleText + '</div>' +
      '<div class="type-toggle-row">' +
        '<button type="button" class="type-toggle-btn' + (f.type === "expense" ? " active-expense" : "") + '" id="btnTypeExpense">💸 Expense</button>' +
        '<button type="button" class="type-toggle-btn' + (f.type === "income" ? " active-income" : "") + '" id="btnTypeIncome">💰 Income</button>' +
      '</div>' +
      '<label class="field-label">Date</label>' +
      '<input type="date" id="fDate" value="' + f.date + '" max="' + todayISO() + '" />' +
      '<label class="field-label" style="margin-top:16px">Category</label>' +
      '<div class="cat-grid">' + catButtons + '</div>' +
      '<label class="field-label" style="margin-top:16px">Amount</label>' +
      '<div class="amount-wrap"><span>₹</span><input type="number" inputmode="decimal" id="fAmount" placeholder="0" value="' + f.amount + '" /></div>' +
      '<label class="field-label" style="margin-top:16px">Note (optional)</label>' +
      '<input type="text" id="fNote" placeholder="e.g. Paddy sale to mandi, tractor fuel" value="' + (f.note||"") + '" />' +
      (f.error ? '<div class="error-text">' + f.error + '</div>' : '') +
      '<button class="save-btn" id="saveBtn">' + saveText + '</button>' +
      (state.editingId ? '<button type="button" id="cancelEditBtn" style="margin-top:10px; width:100%; padding:10px; background:transparent; border:1px solid var(--card-border); color:var(--cream-dim); border-radius:10px; cursor:pointer;">Cancel Edit</button>' : '');
  }

  function renderRecords() {
    var items = monthExpenses();
    var stats = getFinancials(items);
    var groups = groupByDate(items);

    var body = groups.length === 0
      ? '<div class="empty">No entries logged for this month yet.</div>'
      : groups.map(function(g){
          var d = g[0], list = g[1];
          var rows = list.map(function(e){
            var isIncome = e.type === "income";
            var cat = catById(e.category, e.type);
            var confirming = state.confirmDelete === e.id;
            
            var actionControl = confirming
              ? '<div class="action-wrap"><button class="confirm-yes" data-del="' + e.id + '">🗑</button><button class="confirm-no" data-cancel="' + e.id + '">✕</button></div>'
              : '<div class="action-wrap">' +
                  '<button class="icon-btn" data-edit="' + e.id + '">✏️</button>' +
                  '<button class="icon-btn" data-ask="' + e.id + '">🗑</button>' +
                '</div>';

            return '<div class="expense-row">' +
              '<div class="icon-box" style="background:' + cat.hex + '33">' + cat.emoji + '</div>' +
              '<div class="info"><div class="cat-name">' + cat.short + '</div>' +
              (e.note ? '<div class="note">' + escapeHtml(e.note) + '</div>' : '') + '</div>' +
              '<div class="amt ' + (isIncome ? "income" : "expense") + '">' + (isIncome ? "+" : "-") + formatRupee(e.amount) + '</div>' + actionControl +
              '</div>';
          }).join("");
          return '<div><div class="day-label">' + formatDateLabel(d) + '</div>' + rows + '</div>';
        }).join("");

    return '' +
      '<div class="month-nav">' +
      '<button id="prevMonth">‹</button>' +
      '<div class="month-center"><div class="m-title">' + MONTHS[state.viewMonth] + ' ' + state.viewYear + '</div>' +
      '<div class="m-total" style="color:' + (stats.profit >= 0 ? "#81C784" : "#FF7A59") + ';">Net: ' + formatRupee(stats.profit) + '</div></div>' +
      '<button id="nextMonth">›</button>' +
      '</div>' + body;
  }

  function renderSummary() {
    var src = summarySource();
    var stats = getFinancials(src);
    var monthLabel = MONTHS[state.viewMonth] + ' ' + state.viewYear;

    var toggle = '<div class="toggle-row">' +
      '<button class="toggle-btn' + (state.range==="month"?" active":"") + '" data-range="month">' + monthLabel + '</button>' +
      '<button class="toggle-btn' + (state.range==="all"?" active":"") + '" data-range="all">All time</button>' +
      '</div>';

    var pnlCard = '' +
      '<div class="pnl-card">' +
        '<div class="pnl-row"><span>Total Income</span><strong style="color:#81C784;">+' + formatRupee(stats.income) + '</strong></div>' +
        '<div class="pnl-row"><span>Total Expenses</span><strong style="color:#FF7A59;">-' + formatRupee(stats.expense) + '</strong></div>' +
        '<div class="pnl-row total"><span>Net Profit</span><strong style="color:' + (stats.profit >= 0 ? "#81C784" : "#FF7A59") + ';">' + formatRupee(stats.profit) + '</strong></div>' +
      '</div>';

    var expenseData = EXPENSE_CATEGORIES.map(function(c){
      var val = src.filter(function(e){ return e.type !== "income" && e.category === c.id; }).reduce(function(s,e){ return s + e.amount; }, 0);
      return { id: c.id, label: c.label, val: val, cat: c };
    }).filter(function(d){ return d.val > 0; });

    var incomeData = INCOME_CATEGORIES.map(function(c){
      var val = src.filter(function(e){ return e.type === "income" && e.category === c.id; }).reduce(function(s,e){ return s + e.amount; }, 0);
      return { id: c.id, label: c.label, val: val, cat: c };
    }).filter(function(d){ return d.val > 0; });

    var renderBreakdownList = function(title, list) {
      if (list.length === 0) return '';
      var rows = list.map(function(d){
        return '<div class="legend-row">' +
          '<div class="icon-box" style="background:' + d.cat.hex + '33">' + d.cat.emoji + '</div>' +
          '<div class="name">' + d.label + '</div>' +
          '<div class="val">' + formatRupee(d.val) + '</div>' +
          '</div>';
      }).join("");
      return '<div style="margin-top:14px; font-weight:700; font-size:15px; color:var(--cream-dim);">' + title + '</div>' + rows;
    };

    return '<div class="section-title">Financial Summary</div>' + toggle + pnlCard +
      renderBreakdownList("Expenses Breakdown", expenseData) +
      renderBreakdownList("Income Breakdown", incomeData);
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // ---------- handlers ----------
  function attachHandlers() {
    if (state.tab === "add") {
      var dateEl = document.getElementById("fDate");
      var amtEl = document.getElementById("fAmount");
      var noteEl = document.getElementById("fNote");

      dateEl.addEventListener("change", function(){ state.form.date = dateEl.value; });
      amtEl.addEventListener("input", function(){ state.form.amount = amtEl.value; });
      noteEl.addEventListener("input", function(){ state.form.note = noteEl.value; });

      document.getElementById("btnTypeExpense").addEventListener("click", function(){
        state.form.type = "expense"; state.form.category = null; render();
      });
      document.getElementById("btnTypeIncome").addEventListener("click", function(){
        state.form.type = "income"; state.form.category = null; render();
      });

      document.querySelectorAll(".cat-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.form.category = btn.getAttribute("data-cat"); render();
        });
      });

      var cancelBtn = document.getElementById("cancelEditBtn");
      if (cancelBtn) {
        cancelBtn.addEventListener("click", function(){
          state.editingId = null;
          state.form = { type: "expense", date: todayISO(), category: null, amount: "", note: "", error: "" };
          render();
        });
      }

      document.getElementById("saveBtn").addEventListener("click", function(){
        var f = state.form;
        if (!f.category) { f.error = "Pick a category"; render(); return; }
        var amt = parseFloat(f.amount);
        if (!amt || amt <= 0) { f.error = "Enter a valid amount"; render(); return; }
        f.error = "";

        var entry = {
          type: f.type,
          date: f.date,
          category: f.category,
          amount: amt,
          note: (f.note||"").trim(),
          createdAt: state.editingId ? (state.expenses.find(function(x){return x.id===state.editingId;})||{}).createdAt || Date.now() : Date.now()
        };

        if (state.editingId) {
          updateDoc(doc(db, "expenses", state.editingId), entry).catch(function(err){ console.error("update failed", err); });
          state.editingId = null;
        } else {
          addDoc(expensesCol, entry).catch(function(err){ console.error("add failed", err); });
        }

        state.form = { type: "expense", date: todayISO(), category: null, amount: "", note: "", error: "" };
        render();
      });
    }

    if (state.tab === "records") {
      document.getElementById("prevMonth").addEventListener("click", function(){ shiftMonth(-1); });
      document.getElementById("nextMonth").addEventListener("click", function(){ shiftMonth(1); });

      document.querySelectorAll("[data-edit]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-edit");
          var item = state.expenses.find(function(x){ return x.id === id; });
          if (item) {
            state.editingId = id;
            state.form = {
              type: item.type || "expense",
              date: item.date,
              category: item.category,
              amount: item.amount,
              note: item.note || "",
              error: ""
            };
            state.tab = "add";
            render();
          }
        });
      });

      document.querySelectorAll("[data-ask]").forEach(function(btn){
        btn.addEventListener("click", function(){ state.confirmDelete = btn.getAttribute("data-ask"); render(); });
      });
      document.querySelectorAll("[data-cancel]").forEach(function(btn){
        btn.addEventListener("click", function(){ state.confirmDelete = null; render(); });
      });
      document.querySelectorAll("[data-del]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-del");
          deleteDoc(doc(db, "expenses", id)).catch(function(err){ console.error("delete failed", err); });
          state.confirmDelete = null;
          render();
        });
      });
    }

    if (state.tab === "summary") {
      document.querySelectorAll("[data-range]").forEach(function(btn){
        btn.addEventListener("click", function(){ state.range = btn.getAttribute("data-range"); render(); });
      });
    }
  }

  function shiftMonth(delta) {
    var m = state.viewMonth + delta, y = state.viewYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    state.viewMonth = m; state.viewYear = y;
    render();
  }

  document.getElementById("navAdd").addEventListener("click", function(){ state.tab = "add"; render(); });
  document.getElementById("navRecords").addEventListener("click", function(){ state.tab = "records"; render(); });
  document.getElementById("navSummary").addEventListener("click", function(){ state.tab = "summary"; render(); });

  updateLockState();
  render();

  onSnapshot(
    expensesCol,
    function (snapshot) {
      state.expenses = snapshot.docs
        .map(function (d) {
          var data = d.data();
          data.id = d.id;
          return data;
        })
        .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      var tagText = document.getElementById("syncTagText");
      if (tagText) tagText.textContent = snapshot.metadata.fromCache ? "Offline — will sync" : "Synced live";
      render();
    },
    function (err) {
      console.error("sync error", err);
      var tagText = document.getElementById("syncTagText");
      if (tagText) tagText.textContent = "Offline — will sync";
    }
  );

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
