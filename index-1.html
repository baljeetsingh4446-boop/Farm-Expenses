<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Expense Tracker</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --danger: #d32f2f;
            --text: #333333;
            --border: #dddddd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-cancel {
            background-color: #e0e0e0;
            color: #333;
            display: none;
        }

        .expense-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .expense-item:last-child {
            border-bottom: none;
        }

        .expense-details {
            display: flex;
            flex-direction: column;
        }

        .expense-title {
            font-weight: 600;
        }

        .expense-amount {
            color: var(--primary);
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            font-size: 14px;
            flex: none;
        }

        .btn-edit {
            background-color: #1976d2;
            color: white;
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
        }

        .total-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 id="form-title">Add Expense</h2>
        <form id="expense-form">
            <!-- Hidden input to store the ID of the expense currently being edited -->
            <input type="hidden" id="expense-id">
            
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" placeholder="e.g. Diesel, Fertilizer" required>
            </div>
            
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" placeholder="e.g. 4000" required>
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn-submit" id="submit-btn">Add Expense</button>
                <button type="button" class="btn-cancel" id="cancel-btn">Cancel</button>
            </div>
        </form>
    </div>

    <div class="card total-card">
        <span>Total Expenses:</span>
        <span id="total-amount">₹0</span>
    </div>

    <div class="card">
        <h2>Expense History</h2>
        <ul id="expense-list" class="expense-list"></ul>
    </div>
</div>

<script>
    // State management: Load initial data from LocalStorage
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [
        { id: '1', category: 'Diesel', amount: 5000 }
    ];

    const form = document.getElementById('expense-form');
    const expenseIdInput = document.getElementById('expense-id');
    const categoryInput = document.getElementById('category');
    const amountInput = document.getElementById('amount');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const expenseList = document.getElementById('expense-list');
    const totalAmount = document.getElementById('total-amount');

    // Render list items and total amount
    function render() {
        expenseList.innerHTML = '';
        let total = 0;

        expenses.forEach(item => {
            total += Number(item.amount);

            const li = document.createElement('li');
            li.className = 'expense-item';
            li.innerHTML = `
                <div class="expense-details">
                    <span class="expense-title">${item.category}</span>
                    <span class="expense-amount">₹${Number(item.amount).toLocaleString()}</span>
                </div>
                <div class="actions">
                    <button class="btn-action btn-edit" onclick="startEdit('${item.id}')">Edit</button>
                    <button class="btn-action btn-delete" onclick="deleteExpense('${item.id}')">Delete</button>
                </div>
            `;
            expenseList.appendChild(li);
        });

        totalAmount.textContent = `₹${total.toLocaleString()}`;
        localStorage.setItem('expenses', JSON.stringify(expenses));
    }

    // Handle Form Submit for BOTH Add and Update
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const id = expenseIdInput.value;
        const category = categoryInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (id) {
            // FIX: IMMUTABLE MAP UPDATE
            // Replaces the existing expense item with the updated values matching the exact ID
            expenses = expenses.map(item => 
                item.id === id ? { ...item, category, amount } : item
            );
        } else {
            // ADD NEW EXPENSE
            const newExpense = {
                id: Date.now().toString(),
                category,
                amount
            };
            expenses.push(newExpense);
        }

        resetForm();
        render();
    });

    // Populate the form fields with target expense data for editing
    window.startEdit = function(id) {
        const target = expenses.find(item => item.id === id);
        if (!target) return;

        expenseIdInput.value = target.id;
        categoryInput.value = target.category;
        amountInput.value = target.amount;

        formTitle.textContent = 'Edit Expense';
        submitBtn.textContent = 'Update Expense';
        cancelBtn.style.display = 'block';
    };

    // Delete an expense record
    window.deleteExpense = function(id) {
        expenses = expenses.filter(item => item.id !== id);
        if (expenseIdInput.value === id) {
            resetForm();
        }
        render();
    };

    // Cancel edit mode
    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
        expenseIdInput.value = '';
        categoryInput.value = '';
        amountInput.value = '';
        formTitle.textContent = 'Add Expense';
        submitBtn.textContent = 'Add Expense';
        cancelBtn.style.display = 'none';
    }

    // Initial load
    render();
</script>

</body>
</html>
